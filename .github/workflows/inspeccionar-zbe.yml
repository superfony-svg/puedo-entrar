name: Inspeccionar datos ZBE de la DGT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspeccionar-zbe.yml"]

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar índice y ficheros
        run: |
          base=https://nap.dgt.es/datex2/v3/dgt/zbe/ControledZonePublication/
          curl -fsSL "$base" -o index.html
          grep -o 'href="[^"]*\.xml"' index.html | sed 's/href="//;s/"$//' | sort -u > files.txt
          cat files.txt
          mkdir x
          while read f; do curl -fsSL "$base$f" -o "x/$(basename "$f")" || echo "FALLO $f"; done < files.txt
          ls -la x
      - name: Alcalá completo
        run: cat x/AlcalaDeHenares.xml
      - name: Granollers completo
        run: cat x/Granollers.xml
      - name: Resumen de etiquetas en todos
        run: |
          for f in x/*.xml; do
            echo "== $f zonas=$(grep -o '<[a-z0-9]*:controlledZone[ >]' "$f" | wc -l) sticker=$(grep -o 'stickerCondition>[^<]*' "$f" | sort -u | tr '\n' ' ')"
          done
          cat x/*.xml | grep -o '<[A-Za-z0-9]*:[A-Za-z]*' | sort | uniq -c | sort -rn | head -150
      - name: Madrid primeras 400 líneas
        run: head -c 30000 x/Madrid.xml
