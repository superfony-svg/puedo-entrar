name: Inspeccionar ZBE en OpenStreetMap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspeccionar-osm.yml"]

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Overpass
        run: |
          q='[out:json][timeout:180];area["ISO3166-1"="ES"][admin_level=2]->.es;(relation["boundary"="low_emission_zone"](area.es);way["boundary"="low_emission_zone"](area.es););out tags center;'
          curl -fsS --retry 3 -A "puedo-entrar/1.0" --data-urlencode "data=$q" https://overpass-api.de/api/interpreter -o osm.json
          python3 - <<'EOF'
          import json
          d=json.load(open("osm.json"))["elements"]
          print("TOTAL", len(d))
          for e in sorted(d, key=lambda e: e.get("tags",{}).get("name","")):
              t=e.get("tags",{})
              c=e.get("center",{})
              print(f'{e["type"]}/{e["id"]} | {t.get("name","")} | {c.get("lat","")},{c.get("lon","")} | ' + "; ".join(f"{k}={v}" for k,v in t.items() if k not in ("name","boundary","type"))[:300])
          EOF
