name: Comprobar dominios libres (temporal)
on:
  push:
    branches: ['claude/project-thread-c412b2']
    paths: ['.github/workflows/comprobar-dominios.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq whois dnsutils >/dev/null 2>&1 || true
      - name: Comprobar
        run: |
          check() {
            n=$1
            es=$(dig +norecurse NS $n.es @a.nic.es | grep -o 'status: [A-Z]*' | head -1)
            com=$(curl -s -o /dev/null -w '%{http_code}' https://rdap.verisign.com/com/v1/domain/$n.com)
            comwho=$(whois -h whois.verisign-grs.com "$n.com" | grep -m1 -E 'No match|Creation Date' | tr -d '\r')
            echo "RESULT $n | .es $es | .com rdap $com | $comwho"
          }
          for n in google zonazbe puedoentrar matriculazbe puedoentrarzbe mietiquetazbe zbematricula matriculaszbe puedocircular puedoentrarono etiquetazbe consultazbe zbeymatricula mietiqueta puedopasar; do check $n; done
